name: Godot Android APK

on:
  push:
    branches:
      - godot-4-port
    paths:
      - "godot/**"
      - ".github/workflows/godot-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-android:
    name: Export Godot 4.7.2 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.1.13356709" \
            "cmake;3.10.2.4988404"

      - name: Download CC0 environment models and 1K PBR materials
        run: |
          set -euo pipefail
          MODEL_DIR="godot/assets/kenney/Models/GLB format"
          mkdir -p "$MODEL_DIR/Textures"
          BASE="https://raw.githubusercontent.com/petroulacl/fps-buildings-env-kit/main"
          for model in building-type-a building-type-b building-type-c building-type-d building-type-e building-type-f tree-large tree-small; do
            curl -fsSL --retry 3 "$BASE/buildings/kenney-city-kit-suburban/Models/GLB%20format/$model.glb" -o "$MODEL_DIR/$model.glb"
          done
          curl -fsSL --retry 3 "$BASE/buildings/kenney-city-kit-suburban/Models/GLB%20format/Textures/colormap.png" -o "$MODEL_DIR/Textures/colormap.png"
          ZOMBIE_DIR="godot/assets/zombies"
          mkdir -p "$ZOMBIE_DIR"
          ZBASE="https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Zombie%20Apocalypse%20Kit%20-%20March%202024/Characters/glTF"
          for model in Zombie_Arm Zombie_Basic Zombie_Chubby Zombie_Ribcage; do
            curl -fsSL --retry 3 "$ZBASE/$model.gltf" -o "$ZOMBIE_DIR/$model.gltf"
          done
          mkdir -p godot/assets/pbr
          for asset in Asphalt021 Bricks066 Concrete012 Grass004; do
            mkdir -p "godot/assets/pbr/$asset"
            curl -fsSL --retry 3 "https://ambientcg.com/get?file=${asset}_1K-JPG.zip" -o "/tmp/${asset}.zip"
            unzip -oq "/tmp/${asset}.zip" -d "godot/assets/pbr/$asset"
            mkdir -p "/tmp/${asset}_maps"
            for map in Color NormalGL Roughness AmbientOcclusion; do
              source_file="$(find "godot/assets/pbr/$asset" -type f -name "${asset}_1K-JPG_${map}.jpg" -print -quit || true)"
              if [ -n "$source_file" ]; then cp "$source_file" "/tmp/${asset}_maps/"; fi
            done
            rm -rf "godot/assets/pbr/$asset"
            mkdir -p "godot/assets/pbr/$asset"
            if compgen -G "/tmp/${asset}_maps/*.jpg" > /dev/null; then
              cp /tmp/${asset}_maps/*.jpg "godot/assets/pbr/$asset/"
            fi
          done

      - name: Import Godot Android export templates and build APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./godot
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          cache: true
          verbose: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Combate-Zombie-3D-Godot-Android
          path: godot/build/Android/CombateZombie3D.apk
          if-no-files-found: error
          retention-days: 14
