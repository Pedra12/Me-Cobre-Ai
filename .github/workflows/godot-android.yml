name: Godot Android APK

on:
  push:
    branches:
      - godot-4-port
    paths:
      - "godot/**"
      - ".github/workflows/godot-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-android:
    name: Export Godot 4.7.2 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.1.13356709" \
            "cmake;3.10.2.4988404"

      - name: Import Godot Android export templates and build APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./godot
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          cache: true
          verbose: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Combate-Zombie-3D-Godot-Android
          path: godot/build/CombateZombie3D.apk
          if-no-files-found: error
          retention-days: 14
