function animP(r,dt){const u=r.g.userData;r.ph=(r.ph||0)+dt*Math.min(r.sp||0,6)*1.6;const s=Math.sin(r.ph),a=Math.min((r.sp||0)/4,1)*.9;u.ll.rotation.x=s*a;u.rl.rotation.x=-s*a;u.lk.rotation.x=Math.max(0,-s)*a;u.rk.rotation.x=Math.max(0,s)*a;u.tor.position.y=.95+Math.abs(s)*.03*a;u.tor.rotation.z=s*.03*a}
function lobbyList(){const l=[nick+' (host)'];for(const id in MP.rp)l.push(MP.rp[id].nick);return l}
function showLobby(code,names){$('menu').classList.add('hide');$('lobby').classList.remove('hide');$('rc').textContent='Código: '+code;$('rc').dataset.c=code;$('pl').innerHTML=(names||lobbyList()).map((n,i)=>(i+1)+'. '+n).join('<br>');$('stb').classList.toggle('hide',!MP.host)}
function sendLobby(){const l=lobbyList();bc({t:'l',l});showLobby($('rc').dataset.c,l)}
function hostData(c,d){const r=MP.rp[c.peer];if(!r)return;
 if(d.t==='hello'){r.nick=d.n;sendLobby()}
 else if(d.t==='p'){r.tx=d.x;r.tz=d.z;r.tr=d.r;r.hp=d.hp;r.w=d.w}

function applyS(S){wave=S.w;score=S.sc;$('ban').textContent=hp<=0?'Você morreu — observando':(S.b||'');$('pn').textContent=nick+' ('+S.p.length+' jog.)';
 const seen={};for(const a of S.z){seen[a[0]]=1;let z=MP.zm[a[0]];if(!z){z=mkZ(a[1],true);z.id=a[0];MP.zm[a[0]]=z;z.g.position.set(a[2],0,a[3]);z.g.rotation.y=a[4]}z.tx=a[2];z.tz=a[3];z.tr=a[4]}

 const ps={};for(const a of S.p){if(a[0]===MP.myId)continue;ps[a[0]]=1;let r=MP.rp[a[0]];if(!r){r={nick:a[1],g:mkP(a[1]),tx:a[2],tz:a[3],tr:a[4],hp:a[6]};MP.rp[a[0]]=r;scene.add(r.g);r.g.position.set(a[2],0,a[3])}r.tx=a[2];r.tz=a[3];r.tr=a[4];r.hp=a[6];r.g.visible=a[6]>0}
 for(const id in MP.rp)if(!ps[id]){scene.remove(MP.rp[id].g);delete MP.rp[id]}upd()}

 if(MP.host){const S={t:'s',p:[['H',nick,cam.position.x,cam.position.z,yaw+Math.PI,cw,hp]],z:zs.map(z=>[z.id,z.type,+z.g.position.x.toFixed(2),+z.g.position.z.toFixed(2),+z.g.rotation.y.toFixed(2)]),w:wave,sc:score,b:$('ban').textContent};

 else if(MP.cn&&MP.cn.open)MP.cn.send({t:'p',x:cam.position.x,z:cam.position.z,r:yaw,w:cw,hp:hp})}
function clientData(d){if(d.t==='l')showLobby($('rc').dataset.c,d.l);else if(d.t==='start')begin();else if(d.t==='s'&&scene&&state!=='menu')applyS(d);else if(d.t==='d')hurt(d.v);else if(d.t==='o')showOver('FIM DE JOGO')}

$('mk').onclick=()=>{if(typeof Peer==='undefined')return msg('PeerJS não carregou (sem internet?).');setup();const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='';for(let i=0;i<5;i++)code+=ch[Math.random()*ch.length|0];
 MP.on=true;MP.host=true;msg('Criando sala...');const pr=MP.peer=new Peer('czb-'+code);pr.on('error',e=>{MP.on=false;peerErr(e)});
 pr.on('open',()=>{msg('');showLobby(code)});
 pr.on('connection',c=>{c.on('open',()=>{if(Object.keys(MP.c).length>=3||MP.started){c.close();return}MP.c[c.peer]=c;MP.rp[c.peer]={nick:'?',g:null,tx:0,tz:0,tr:0,hp:100,w:1};sendLobby()});

 const pr=MP.peer=new Peer();pr.on('error',e=>{MP.on=false;peerErr(e)});

const tm={};
addEventListener('touchstart',e=>{if(state!=='play')return;for(const t of e.changedTouches){if(t.target.closest('.btn,.ov,.ui'))continue;if(t.clientX<innerWidth*.45){const r=$('joy').getBoundingClientRect();tm[t.identifier]={k:'j',cx:r.left+60,cy:r.top+60}}else tm[t.identifier]={k:'l',x:t.clientX,y:t.clientY}}},{passive:false});

const tend=e=>{for(const t of e.changedTouches){const o=tm[t.identifier];if(o&&o.k==='j'){jx=0;jy2=0;$('knob').style.transform=''}delete tm[t.identifier]}};addEventListener('touchend',tend);addEventListener('touchcancel',tend);

hold('ads',()=>{ads=!ads});hold('rl',doReload);for(let i=0;i<3;i++)hold('tb'+i,()=>sel(i));hold('jp',()=>{if(jy==0)vy=7});hold('ps',()=>{if(state==='play'||state==='spec'){if(!MP.on)state='pause';$('pause').classList.remove('hide')}});

 (function n(){if(i>=steps.length){clk=new THREE.Clock();$('pn').textContent=nick;reset();if(MP.host)for(const id in MP.rp){const r=MP.rp[id];r.g=mkP(r.nick);scene.add(r.g)}upd();$('load').classList.add('hide');$('hud').classList.remove('hide');if(!window._lp){window._lp=1;loop()}return}
  $('lt').textContent=steps[i][0]+'...';$('bar').firstElementChild.style.width=((i+1)/steps.length*100)+'%';setTimeout(()=>{steps[i][1]();i++;n()},250)})()}
